# Side Arm Configuration - RIGHT ARM (V2)
# Right arm using V2 hardware, positioned at negative Y
#
# Usage:
#   ros2 launch parachute_coordinator dual_arm_bringup.launch.py

# =============================================================================
# ARM IDENTITY
# =============================================================================
side_arm:
  arm_id: "right"
  description: "Right Side Arm - V2 hardware at negative Y"

  # URDF/Xacro file to use (V2 with frame structure)
  urdf_file: "side_arm_v2.urdf.xacro"

  # Frame prefix for TF frames (right_ prefix for all links/joints)
  frame_prefix: "right_"

  # Namespace for topics/services
  namespace: "side_arm_right"

# =============================================================================
# HARDWARE COMMUNICATION
# =============================================================================
serial_bridge:
  serial_port: "/dev/ttyUSB1"
  baud_rate: 115200
  state_request_hz: 10.0
  auto_request_state: true

# =============================================================================
# MOTOR CALIBRATION
# =============================================================================
coordinate_node:
  steps_per_mm_horizontal: 300.0
  steps_per_mm_vertical: 100.0    # Dual stepper setup
  dc_mm_per_second: 4.0
  dc_speed_percent: 50
  default_speed_horizontal: 1200.0
  default_speed_vertical: 500.0
  sim_speed_mm_per_sec: 50.0

  # Homing position - V2 homes to max X (carriage at far end)
  home_x_mm: 340.0
  home_y_mm: 0.0
  home_z_mm: 0.0

  # Position invert - V2 steps decrease from max X
  position_invert_x: true
  position_invert_y: false
  position_invert_z: true

# =============================================================================
# WORKSPACE LIMITS
# =============================================================================
# V2 has increased Y range due to dual stepper motors
workspace:
  max_x_mm: 340.0
  max_y_mm: 350.0
  max_z_mm: 150.0

# =============================================================================
# HOOK POSITIONING
# =============================================================================
interface_node:
  side_arm_frame: "right_side_arm_origin"

  # Hook offset from origin when homed (mm) - TODO: Calibrate for V2
  hook_offset_x_mm: 10.0
  hook_offset_y_mm: 115.0
  hook_offset_z_mm: -156.0

  # Motor direction inversions - V2 is rotated 180° from V1
  invert_x: false
  invert_y: false
  invert_z: false

  approach_offset_z: 50.0
  insert_depth_z: 30.0

  enable_vision_servo: true
  servo_kp_x: 1.2
  servo_deadband_px: 5.0
  servo_timeout_sec: 10.0
  servo_min_speed: 400
  servo_max_speed: 1100
  image_width_px: 640

# =============================================================================
# VISUALIZATION
# =============================================================================
visualizer:
  roll: -1.5708
  pitch: 0.0
  yaw: -1.5708
  offset_x: -0.01
  offset_y: 0.009
  offset_z: 0.07
  scale: 0.001
  servo_axis: "pitch"
  servo_scale: 0.001
  publish_hook_tf: false
  hook_frame_id: "right_side_arm_hook"
  publish_camera_tf: false
  camera_frame_id: "right_camera_frame"
  camera_offset_x: 0.0
  camera_offset_y: 0.0
  camera_offset_z: 0.05
  camera_roll: 0.0
  camera_pitch: 3.1416
  camera_yaw: 0.0

# =============================================================================
# JOINT STATE PUBLISHER
# =============================================================================
joint_state_publisher:
  servo_scale: 0.001
  publish_rate: 50.0
  test_x: 0.15
  test_y: 0.175  # Mid-range for V2's larger Y travel
  test_z: 0.05
  test_servo: 0.0

# =============================================================================
# TF TRANSFORM
# =============================================================================
# Right arm at negative Y, facing positive Y (toward parachute)
tf_transform:
  x: 0.07
  y: -0.41   # Opposite side (negative Y)
  z: -0.26
  roll: 1.5708
  pitch: 0.0
  yaw: 0.0   # Facing +Y
  parent_frame: "world"
  child_frame: "right_side_arm_origin"
