# Side Arm Configuration - LEFT ARM (V1)
# Left arm using V1 hardware, positioned at positive Y
#
# Usage:
#   ros2 launch parachute_coordinator dual_arm_bringup.launch.py

# =============================================================================
# ARM IDENTITY
# =============================================================================
side_arm:
  arm_id: "left"
  description: "Left Side Arm - V1 hardware at positive Y"

  # URDF/Xacro file to use
  urdf_file: "side_arm.urdf.xacro"

  # Frame prefix for TF frames (left_ prefix for all links/joints)
  frame_prefix: "left_"

  # Namespace for topics/services
  namespace: "side_arm_left"

# =============================================================================
# HARDWARE COMMUNICATION
# =============================================================================
serial_bridge:
  serial_port: "/dev/ttyUSB0"
  baud_rate: 115200
  state_request_hz: 10.0
  auto_request_state: true

# =============================================================================
# MOTOR CALIBRATION
# =============================================================================
coordinate_node:
  steps_per_mm_horizontal: 300.0
  steps_per_mm_vertical: 100.0
  dc_mm_per_second: 4.0
  dc_speed_percent: 50
  default_speed_horizontal: 1200.0
  default_speed_vertical: 500.0
  sim_speed_mm_per_sec: 50.0

  # Homing position - V1 homes to origin (0, 0, 0)
  home_x_mm: 0.0
  home_y_mm: 0.0
  home_z_mm: 0.0

  # Position invert - V1 steps increase from 0
  position_invert_x: true
  position_invert_y: false
  position_invert_z: false

# =============================================================================
# WORKSPACE LIMITS
# =============================================================================
workspace:
  max_x_mm: 300.0
  max_y_mm: 200.0
  max_z_mm: 150.0

# =============================================================================
# HOOK POSITIONING
# =============================================================================
interface_node:
  side_arm_frame: "left_side_arm_origin"

  # Hook offset from origin when homed (mm)
  hook_offset_x_mm: 10.0
  hook_offset_y_mm: 210.0
  hook_offset_z_mm: -156.0

  # Motor direction inversions
  invert_x: false
  invert_y: false
  invert_z: false

  approach_offset_z: 50.0
  insert_depth_z: 30.0

  enable_vision_servo: true
  servo_kp_x: 1.2
  servo_deadband_px: 5.0
  servo_timeout_sec: 10.0
  servo_min_speed: 400
  servo_max_speed: 1100
  image_width_px: 640

# =============================================================================
# VISUALIZATION
# =============================================================================
visualizer:
  roll: -1.5708
  pitch: 0.0
  yaw: -1.5708
  offset_x: -0.01
  offset_y: 0.009
  offset_z: 0.07
  scale: 0.001
  servo_axis: "pitch"
  servo_scale: 0.001
  publish_hook_tf: false
  hook_frame_id: "left_side_arm_hook"
  publish_camera_tf: false
  camera_frame_id: "left_camera_frame"
  camera_offset_x: 0.0
  camera_offset_y: 0.0
  camera_offset_z: 0.05
  camera_roll: 0.0
  camera_pitch: 3.1416
  camera_yaw: 0.0

# =============================================================================
# JOINT STATE PUBLISHER
# =============================================================================
joint_state_publisher:
  servo_scale: 0.001
  publish_rate: 50.0
  test_x: 0.15
  test_y: 0.10
  test_z: 0.05
  test_servo: 0.0

# =============================================================================
# TF TRANSFORM
# =============================================================================
# Left arm at positive Y, facing negative Y (toward parachute)
tf_transform:
  x: 0.37
  y: 0.41
  z: -0.26
  roll: 1.5708
  pitch: 0.0
  yaw: 3.1416   # Facing -Y
  parent_frame: "world"
  child_frame: "left_side_arm_origin"
